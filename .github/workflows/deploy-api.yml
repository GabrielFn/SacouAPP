# Deploys the API to Cloud Run after a green CI on main (ADR 0068, D4; routine in docs/operacao/deploy.md).
# Runs only the main code: workflow_run always uses this file from the default branch, never from a PR.
# No secret here: the provider and the three accounts are repository variables, and the database URL stays in Secret Manager.
# Each Google job has its own account, bound to its own OIDC subject (scripts/gcp/harden-deploy-identities.sh):
# build (no environment) only pushes images; deploy-test and deploy-production each deploy only their service.
name: Deploy API

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  # Deploys only when the commit touches what the API is built from: the `api` area of scripts/lib/ci-areas.mjs
  # (tested in test:tooling). Docs-only or apps/mobile-only commits skip the deploy; an empty or failed diff deploys.
  # Merges are squashed, so the commit against its first parent is the whole change.
  changes:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      api: ${{ steps.filter.outputs.api }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Detect API changes
        id: filter
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          files="$(git diff --no-renames --name-only "$HEAD_SHA^1" "$HEAD_SHA")" || files=""
          printf 'Changed files:\n%s\n' "${files:-<none>}"
          printf '%s\n' "$files" | node scripts/ci-areas.mjs | tee -a "$GITHUB_OUTPUT"

  # Builds the image once and pushes it; the deploys below take it by digest, so production runs what test ran.
  build:
    needs: changes
    if: needs.changes.outputs.api != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.push.outputs.image }}
    env:
      IMAGE_TAG: us-east4-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/sacou/api:${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      # Before the authentication, so no credential file can reach the build context.
      - name: Build image
        run: docker build --provenance=false --tag "$IMAGE_TAG" .

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_BUILDER_SA }}
          token_format: access_token
          create_credentials_file: false

      - name: Push image
        id: push
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          printf '%s' "$ACCESS_TOKEN" | docker login --username oauth2accesstoken --password-stdin https://us-east4-docker.pkg.dev
          docker push --quiet "$IMAGE_TAG"
          # The digest the registry holds, so the deploys take exactly the pushed manifest.
          digest="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$IMAGE_TAG")"
          if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "No digest for the pushed image"
            exit 1
          fi
          echo "image=${IMAGE_TAG%:*}@$digest" >> "$GITHUB_OUTPUT"
          docker logout https://us-east4-docker.pkg.dev

  # One deploy per service at a time, never cancelled halfway. Per job, not per workflow: a run waiting for the
  # production approval must not hold back the next test deploy.
  deploy-test:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: deploy-api-test
      cancel-in-progress: false
    environment:
      name: test
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Deploy sacou-api-test
        id: deploy
        uses: ./.github/actions/deploy-cloud-run
        with:
          service: sacou-api-test
          aspnetcore-environment: Staging
          runtime-account: sacou-api-test-run
          database-secret: sacou-database-url-test
          expo-secret: sacou-expo-access-token-test
          sentry-secret: sacou-sentry-dsn-api
          invoker-account: sacou-tasks-invoker-test
          tasks-queue: sacou-notifications-test
          # Who opens /painel (ADR 0085, D1): the variable of the test environment, never in the repository.
          operator-subjects: ${{ vars.SACOU_OPERATOR_UIDS }}
          # The host authorized in Firebase for the round page's web login (ADR 0070); status.url gives another alias.
          public-base-url: https://sacou-api-test-804880427435.us-east4.run.app
          image: ${{ needs.build.outputs.image }}
          project-id: ${{ vars.GCP_PROJECT_ID }}
          workload-identity-provider: ${{ vars.GCP_WIF_PROVIDER }}
          deployer: ${{ vars.GCP_DEPLOYER_TEST_SA }}

  # The same image, by digest, after the test /health passed. The production environment requires the owner's
  # approval on every run (question 87): that approval is the explicit ok of each production deploy.
  deploy-production:
    needs: [build, deploy-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: deploy-api-production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Deploy sacou-api
        id: deploy
        uses: ./.github/actions/deploy-cloud-run
        with:
          service: sacou-api
          aspnetcore-environment: Production
          runtime-account: sacou-api-run
          database-secret: sacou-database-url-prod
          expo-secret: sacou-expo-access-token-prod
          sentry-secret: sacou-sentry-dsn-api
          invoker-account: sacou-tasks-invoker
          tasks-queue: sacou-notifications
          # Who opens /painel (ADR 0085, D1): the variable of the production environment, never in the repository.
          operator-subjects: ${{ vars.SACOU_OPERATOR_UIDS }}
          image: ${{ needs.build.outputs.image }}
          project-id: ${{ vars.GCP_PROJECT_ID }}
          workload-identity-provider: ${{ vars.GCP_WIF_PROVIDER }}
          deployer: ${{ vars.GCP_DEPLOYER_PROD_SA }}
