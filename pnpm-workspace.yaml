packages:
  - apps/mobile
  - apps/web
  - packages/*

allowBuilds:
  unrs-resolver: false
  # Postinstall scripts of the JS Firebase SDK that @react-native-firebase pulls in; not needed (E4.3).
  "@firebase/util": false
  protobufjs: false
  # The Sentry CLI binary comes in its platform package (an optional dependency); its postinstall
  # only downloads a fallback copy (E5.2, ADR 0080).
  "@sentry/cli": false

# Advisory fix, see docs/seguranca/varredura-ci.md.
overrides:
  eslint-plugin-functional>deepmerge-ts: 8.0.2
  # GHSA-m9gg-hp2v-232j: the JS Firebase SDK under @react-native-firebase pins grpc-js 1.9; the app
  # never loads Firestore (the native SDK does the work), so the patched line is safe here (E4.3).
  "@firebase/firestore>@grpc/grpc-js": 1.13.7

# Each entry needs a reason and an expiry in scripts/npm-audit-exceptions.json (test:tooling checks).
audit:
  ignore:
    - GHSA-mrhx-c7xc-m3w5
    - GHSA-fc5q-39xc-vjpf

catalog:
  "@eslint/js": 9.39.5
  "@types/node": 22.20.5
  eslint: 9.39.5
  eslint-config-expo: 58.0.4
  eslint-config-prettier: 10.1.8
  eslint-plugin-functional: 10.0.1
  prettier: 3.9.10
  typescript: 6.0.3
  typescript-eslint: 8.72.1
  vite: 8.3.5
  vitest: 5.0.5
