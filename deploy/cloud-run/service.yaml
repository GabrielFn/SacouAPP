# The Cloud Run service of the API (ADR 0068, D2). One template for both: .github/actions/deploy-cloud-run fills the
# ${...} names with envsubst and runs `gcloud run services replace`. Only names here, never a secret value.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: ${SERVICE_NAME}
  labels:
    cloud.googleapis.com/location: us-east4
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        # Scale to zero (question 90) and one instance at most: the rate limiter lives in the process memory.
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "1"
        # Request-based billing: no CPU outside a request, so the API has no background work (architecture test).
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      serviceAccountName: ${RUNTIME_ACCOUNT}
      containerConcurrency: 80
      timeoutSeconds: 60
      containers:
        - image: ${IMAGE}
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: ${ASPNETCORE_ENVIRONMENT}
            - name: Database__MigrateOnStartup
              value: "true"
            # The origin of the round's public page and its share link (ADR 0070, D1): not a secret.
            - name: RoundPage__PublicBaseUrl
              value: ${ROUND_PAGE_BASE_URL}
            # Read from Secret Manager by the runtime account; never a plain value.
            - name: SACOU_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ${DATABASE_SECRET}
                  key: latest
            # Push through Expo (ADR 0069, D11): the access token of this environment, read by the runtime account only.
            - name: SACOU_EXPO_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ${EXPO_SECRET}
                  key: latest
            # sentry-begin: errors to Sentry (ADR 0080, D2). The deploy action drops this block when the environment
            # has no Sentry secret yet; without the DSN the API runs with Sentry off.
            - name: SACOU_SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: ${SENTRY_SECRET}
                  key: latest
            # The release of the events: the start of the image digest. Not a secret.
            - name: SENTRY_RELEASE
              value: ${SENTRY_RELEASE}
            # sentry-end
            # The OIDC token Cloud Tasks and the daily sweep send (ADR 0069, D10): each pair must be equal, or the API
            # refuses to start. The audience is the service's own URL; the e-mail is the invoker of this environment.
            - name: ServiceCaller__Audience
              value: ${SERVICE_URL}
            - name: NotificationTasks__ServiceUrl
              value: ${SERVICE_URL}
            - name: ServiceCaller__Email
              value: ${INVOKER_EMAIL}
            - name: NotificationTasks__InvokerEmail
              value: ${INVOKER_EMAIL}
            - name: NotificationTasks__Project
              value: ${PROJECT_ID}
            - name: NotificationTasks__Location
              value: us-east4
            - name: NotificationTasks__Queue
              value: ${TASKS_QUEUE}
            # Who opens /painel (E7.2, ADR 0085, D1): the Firebase UIDs of the GitHub variable SACOU_OPERATOR_UIDS of this
            # environment, comma-separated. Not a secret; empty lets nobody in.
            - name: Operations__OperatorSubjects
              value: "${OPERATOR_SUBJECTS}"
            # The data protection contact on /excluir-conta (E6.4): the GitHub variable SACOU_DATA_PROTECTION_EMAIL of this
            # environment. Not a secret (it is on a public page); the API refuses to start without it in Production.
            - name: DataProtection__ContactEmail
              value: "${DATA_PROTECTION_EMAIL}"
          # The migrations run before the port opens: 24 × 5 s gives them two minutes (ADR 0068, D7).
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 24
  # Every deploy sends all traffic back to the newest revision, after a manual rollback too (D13).
  traffic:
    - percent: 100
      latestRevision: true
