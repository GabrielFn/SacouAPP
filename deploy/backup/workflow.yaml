# Starts the two backup jobs once a day (E5.3, ADR 0082, D1). One Cloud Scheduler job calls this workflow, so the
# backups add one scheduler job to the two sweeps of the notifications: three, the free tier of the billing account.
# Each job is started even when the other fails to start; the job's own result goes to the alert of
# scripts/gcp/setup-backups.sh. No envsubst here: ${...} is the Workflows syntax.
main:
  steps:
    - init:
        assign:
          - project: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
          - location: ${sys.get_env("GOOGLE_CLOUD_LOCATION")}
          - jobs: ["sacou-backup-test", "sacou-backup"]
          - failed: []
    - startEach:
        for:
          value: job
          in: ${jobs}
          steps:
            - start:
                try:
                  call: googleapis.run.v2.projects.locations.jobs.run
                  args:
                    name: ${"projects/" + project + "/locations/" + location + "/jobs/" + job}
                    # Started, not awaited: no polling steps, and the job's failure has its own alert.
                    connector_params:
                      skip_polling: true
                except:
                  as: error
                  steps:
                    - remember:
                        assign:
                          - failed: ${list.concat(failed, job)}
    - finish:
        switch:
          - condition: ${len(failed) > 0}
            raise: ${"Could not start the backup jobs " + json.encode_to_string(failed)}
    - done:
        return: ${jobs}
