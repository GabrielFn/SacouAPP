# Local development database. Integration tests do not use this file (Testcontainers starts its own).
# Runbook: docs/operacao/postgres-local.md. Decisions: docs/arquitetura/adr/0020-postgres-local-e-testes-de-integracao.md
services:
  postgres:
    # Same image as apps/api/tests/Sacou.Integration.Tests/IntegrationDatabase.cs (a guard keeps them equal).
    image: postgres:18.6@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Postgres 18 keeps the data in a versioned subfolder of /var/lib/postgresql, not in /data.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # -h 127.0.0.1: on first start the image runs a temporary server that listens only on the Unix socket.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

volumes:
  postgres-data:
