<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Definir a nota</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
a{color:#0F1B2D;text-decoration:none}a:hover{color:#1F5BFF}
.step{width:56px;height:56px;border-radius:28px;border:1.5px solid #0F1B2D;display:flex;align-items:center;justify-content:center;flex:none}
.chips{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.chips button{height:48px;border-radius:12px;border:1.5px solid rgba(15,27,45,0.2);font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:20px}
.chips button[aria-pressed="true"]{background:#0F1B2D;color:#F6F1E7;border-color:#0F1B2D}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: rgba(15,27,45,0.55); font-family: Inter, sans-serif; color: #0F1B2D; box-sizing: border-box">

  <div role="dialog" aria-modal="true" aria-labelledby="t" style="position: absolute; left: 0; right: 0; bottom: 0; background: #F6F1E7; border-radius: 24px 24px 0 0; padding: 12px 20px 28px; display: flex; flex-direction: column; gap: 16px; box-sizing: border-box">
    <span aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: rgba(15,27,45,0.2)"></span>

    <div style="display: flex; align-items: center; gap: 12px">
      <span aria-hidden="true" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 20px; background: #E9E1D1">BI</span>
      <div style="flex: 1">
        <h2 id="t" style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 28px; line-height: 1">Nota da Bia</h2>
        <span style="font-size: 14px; color: #4A5566">Ponteira · líbero · mensalista</span>
      </div>
      <a href="Membros.dc.html" aria-label="Fechar" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </a>
    </div>

    <div style="padding: 12px; border-radius: 14px; background: #FFF8E1; border: 1.5px dashed #9A6A00; display: flex; align-items: center; gap: 10px">
      <span style="flex: 1; font-size: 14px; color: #5C3F00">Ela sugeriu <b style="font-size: 16px; color: #0F1B2D">4,0</b> no cadastro.</span>
      <button style="height: 44px; padding: 0 14px; border-radius: 12px; border: 1.5px solid #0F1B2D; font-size: 14px; font-weight: 700">Usar 4,0</button>
    </div>

    <div style="display: flex; align-items: center; justify-content: center; gap: 24px; padding: 4px 0">
      <button class="step" aria-label="Diminuir meio ponto"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
      <output aria-live="polite" style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 72px; line-height: 1; font-variant-numeric: tabular-nums; width: 110px; text-align: center">3,5</output>
      <button class="step" aria-label="Aumentar meio ponto"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>

    <div class="chips" role="group" aria-label="Atalhos de nota">
      <button aria-pressed="false">1</button>
      <button aria-pressed="false">2</button>
      <button aria-pressed="false">3</button>
      <button aria-pressed="false">4</button>
      <button aria-pressed="false">5</button>
    </div>
    <p style="margin: -8px 0 0; display: flex; justify-content: space-between; font-size: 13px; color: #4A5566"><span>1 · Tô aprendendo</span><span>5 · Jogo federado</span></p>

    <p style="margin: 0; display: flex; gap: 8px; font-size: 13px; color: #4A5566; line-height: 1.4">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex: none; margin-top: 1px"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
      <span>Usada só no sorteio. A Bia não vê a nota, e só admins e co-admins podem mudar.</span>
    </p>

    <div style="display: flex; gap: 8px">
      <a href="Membros.dc.html" style="flex: 1; height: 56px; border-radius: 14px; border: 1.5px solid #0F1B2D; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700">Agora não</a>
      <button style="flex: 1.5; height: 56px; border-radius: 14px; background: #FF5A1F; color: #0F1B2D; font-size: 16px; font-weight: 700">Salvar 3,5</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

}
</script>
</body>
</html>
