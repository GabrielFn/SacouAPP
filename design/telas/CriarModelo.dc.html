<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Criar grupo · modelo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left}
a{color:#0F1B2D}a:hover{color:#1F5BFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F6F1E7; font-family: Inter, sans-serif; color: #0F1B2D; box-sizing: border-box">

  <header style="padding: 20px 12px 0; display: flex; align-items: center; gap: 4px">
    <a href="Inicio.dc.html" aria-label="Voltar" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <span style="font-size: 16px; font-weight: 600">Novo grupo</span>
    <span style="margin-left: auto; margin-right: 8px; font-size: 14px; color: #4A5566">Passo 1 de 2</span>
  </header>
  <div aria-hidden="true" style="margin: 6px 20px 0; height: 4px; border-radius: 2px; background: rgba(15,27,45,0.12)"><div style="width: 50%; height: 4px; border-radius: 2px; background: #FF5A1F"></div></div>

  <div style="padding: 20px 20px 16px">
    <h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 38px; line-height: 1">Como é o seu racha?</h1>
    <p style="margin: 6px 0 0; font-size: 15px; color: #4A5566">Escolha um jeito de começar. Dá pra mudar tudo depois.</p>
  </div>

  <div role="radiogroup" aria-label="Modelo do grupo" style="padding: 0 16px; display: flex; flex-direction: column; gap: 10px">

    <button role="radio" aria-checked="false" style="display: flex; gap: 14px; align-items: center; padding: 14px; border-radius: 16px; background: #FFFFFF; border: 1.5px solid rgba(15,27,45,0.12); min-height: 84px; width: 100%; box-sizing: border-box">
      <svg aria-hidden="true" width="44" height="56" viewBox="0 0 44 56" fill="none" stroke="#0F1B2D" stroke-width="2"><rect x="3" y="3" width="38" height="50" rx="2"/><line x1="3" y1="28" x2="41" y2="28" stroke-width="3"/><circle cx="22" cy="15" r="4" fill="#FFC83D" stroke="none"/></svg>
      <span style="flex: 1; display: flex; flex-direction: column; gap: 3px">
        <span style="font-size: 17px; font-weight: 700">Pelada descontraída</span>
        <span style="font-size: 14px; line-height: 1.35; color: #4A5566">Liga lista aberta e sorteio rápido. Sem cobrança.</span>
      </span>
    </button>

    <button role="radio" aria-checked="true" style="display: flex; gap: 14px; align-items: center; padding: 13px; border-radius: 16px; background: #FFFFFF; border: 2.5px solid #FF5A1F; min-height: 84px; width: 100%; box-sizing: border-box; position: relative">
      <svg aria-hidden="true" width="44" height="56" viewBox="0 0 44 56" fill="none" stroke="#0F1B2D" stroke-width="2"><rect x="3" y="3" width="38" height="50" rx="2"/><line x1="3" y1="28" x2="41" y2="28" stroke-width="3"/><line x1="3" y1="19" x2="41" y2="19"/><line x1="3" y1="37" x2="41" y2="37"/><rect x="9" y="42" width="8" height="6" fill="#FF5A1F" stroke="none"/><rect x="18" y="42" width="8" height="6" fill="#FF5A1F" stroke="none"/><rect x="27" y="42" width="8" height="6" fill="#FF5A1F" stroke="none"/></svg>
      <span style="flex: 1; display: flex; flex-direction: column; gap: 3px">
        <span style="font-size: 17px; font-weight: 700">Racha organizado</span>
        <span style="font-size: 14px; line-height: 1.35; color: #4A5566">Liga mensalistas, Pix, sorteio por nível e fila de quem perde sai.</span>
      </span>
      <span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 14px; background: #FF5A1F; display: flex; align-items: center; justify-content: center; flex: none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0F1B2D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
    </button>

    <button role="radio" aria-checked="false" style="display: flex; gap: 14px; align-items: center; padding: 14px; border-radius: 16px; background: #FFFFFF; border: 1.5px solid rgba(15,27,45,0.12); min-height: 84px; width: 100%; box-sizing: border-box">
      <svg aria-hidden="true" width="44" height="56" viewBox="0 0 44 56" fill="none" stroke="#0F1B2D" stroke-width="2"><rect x="3" y="3" width="38" height="50" rx="2"/><line x1="3" y1="28" x2="41" y2="28" stroke-width="3"/><g fill="#1F5BFF" stroke="none"><rect x="8" y="33" width="7" height="6"/><rect x="18.5" y="33" width="7" height="6"/><rect x="29" y="33" width="7" height="6"/><rect x="8" y="42" width="7" height="6"/><rect x="18.5" y="42" width="7" height="6"/></g><rect x="29" y="42" width="7" height="6" fill="#FFC83D" stroke="none"/></svg>
      <span style="flex: 1; display: flex; flex-direction: column; gap: 3px">
        <span style="display: flex; align-items: center; gap: 8px"><span style="font-size: 17px; font-weight: 700">Treino</span><span style="font-size: 11px; font-weight: 800; padding: 2px 7px; border-radius: 6px; background: #FFC83D; color: #0F1B2D">Pro</span></span>
        <span style="font-size: 14px; line-height: 1.35; color: #4A5566">Liga presença e rotação 5x1 ou 4x2 (Pro). Sem fila de times.</span>
      </span>
    </button>

    <button role="radio" aria-checked="false" style="display: flex; gap: 14px; align-items: center; padding: 14px; border-radius: 16px; background: #FFFFFF; border: 1.5px solid rgba(15,27,45,0.12); min-height: 84px; width: 100%; box-sizing: border-box">
      <svg aria-hidden="true" width="44" height="56" viewBox="0 0 44 56" fill="none" stroke="#0F1B2D" stroke-width="2"><rect x="0" y="0" width="44" height="56" rx="3" fill="#F3E3C3" stroke="none"/><rect x="5" y="5" width="34" height="46" rx="2"/><line x1="5" y1="28" x2="39" y2="28" stroke-width="3"/><path d="M15 15l3-4 4 4 4-4 3 4v4H15z" fill="#FFC83D" stroke="#0F1B2D" stroke-width="1.5" stroke-linejoin="round"/></svg>
      <span style="flex: 1; display: flex; flex-direction: column; gap: 3px">
        <span style="font-size: 17px; font-weight: 700">Areia rei da quadra</span>
        <span style="font-size: 14px; line-height: 1.35; color: #4A5566">Liga duplas ou quartetos, rei da quadra e ranking do dia.</span>
      </span>
    </button>

    <button style="display: flex; align-items: center; gap: 12px; padding: 0 14px; height: 60px; border-radius: 16px; border: 1.5px dashed rgba(15,27,45,0.4); width: 100%; box-sizing: border-box">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      <span style="display: flex; flex-direction: column">
        <span style="font-size: 16px; font-weight: 700">Do zero</span>
        <span style="font-size: 13px; color: #4A5566">Tudo desligado. Você liga o que usar.</span>
      </span>
    </button>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 28px">
    <a href="CriarPerguntas.dc.html" style="height: 58px; border-radius: 14px; background: #FF5A1F; color: #0F1B2D; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700; text-decoration: none">Continuar com Racha organizado</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
