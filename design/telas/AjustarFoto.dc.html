<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Ajustar foto da cartinha</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
a{color:#0F1B2D;text-decoration:none}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));padding:4px;border-radius:14px;background:rgba(15,27,45,0.08)}
.seg button{height:44px;border-radius:11px;font-size:14px;font-weight:500;color:#4A5566}
.seg button[aria-pressed="true"]{background:#FFFFFF;color:#0F1B2D;font-weight:700}
.tool{height:64px;border-radius:14px;background:#FFFFFF;border:1.5px solid rgba(15,27,45,0.15);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px;font-weight:600}
.tool[aria-pressed="true"]{background:#0F1B2D;color:#F6F1E7;border-color:#0F1B2D}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F6F1E7; font-family: Inter, sans-serif; color: #0F1B2D; box-sizing: border-box">

  <header style="padding: 20px 12px 0; display: flex; align-items: center">
    <a href="Cartinha.dc.html" aria-label="Voltar" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 30px; line-height: 1">Foto da cartinha</h1>
  </header>

  <div style="margin: 8px 16px 0">
    <div class="seg">
      <button aria-pressed="false">Original</button>
      <button aria-pressed="true">Recortada</button>
    </div>
  </div>

  <div aria-label="Área de enquadramento" style="margin: 12px 16px 0; height: 332px; border-radius: 20px; position: relative; overflow: hidden; background-color: #FFFFFF; background-image: linear-gradient(45deg, #E6E1D6 25%, transparent 25%, transparent 75%, #E6E1D6 75%), linear-gradient(45deg, #E6E1D6 25%, transparent 25%, transparent 75%, #E6E1D6 75%); background-size: 20px 20px; background-position: 0 0, 10px 10px; border: 1.5px solid rgba(15,27,45,0.15)">
    <div aria-hidden="true" style="position: absolute; left: 50%; top: 18px; width: 214px; height: 300px; transform: translateX(-50%); border: 2.5px dashed #FF5A1F; border-radius: 18px; box-sizing: border-box"></div>
    <svg aria-hidden="true" width="230" height="260" viewBox="0 0 100 113" style="position: absolute; left: 50%; top: 40px; transform: translateX(-50%)"><g stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"><path d="M10 113C10 84 27 68 50 68C73 68 90 84 90 113Z" fill="#33496B"/><rect x="42" y="50" width="16" height="22" rx="6" fill="#3D5579"/><ellipse cx="50" cy="32" rx="19" ry="23" fill="#3D5579"/></g><path d="M31 28C31 14 40 8 50 8C61 8 70 15 69 29C65 21 58 18 50 19C42 19 35 22 31 28Z" fill="#1A2638"/><path d="M50 68L44 80L50 86L56 80Z" fill="#FF5A1F"/></svg>
    <span style="position: absolute; left: 12px; top: 12px; height: 28px; padding: 0 10px; border-radius: 14px; background: #12A150; color: #FFFFFF; display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 700">
      <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Fundo removido
    </span>
  </div>
  <p style="margin: 8px 24px 0; font-size: 13px; color: #4A5566; text-align: center">Arraste para posicionar. Use dois dedos para aproximar. A linha laranja é a borda da cartinha.</p>

  <section aria-labelledby="ref-title" style="margin: 14px 16px 0">
    <h2 id="ref-title" style="margin: 0 0 8px; font-size: 15px; font-weight: 700">Ajustar o recorte</h2>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <button class="tool" aria-pressed="true"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20H9L4 15l10-10 7 7-6 6"/></svg>Apagar</button>
      <button class="tool" aria-pressed="false"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/></svg>Restaurar</button>
      <button class="tool" aria-pressed="false"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>Desfazer</button>
    </div>
    <label style="margin-top: 12px; display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 600">Pincel
      <input type="range" min="4" max="60" value="22" aria-label="Tamanho do pincel" style="flex: 1; accent-color: #FF5A1F; height: 44px">
    </label>
  </section>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 26px; display: flex; gap: 8px">
    <button style="flex: 1; height: 56px; border-radius: 14px; border: 1.5px solid #0F1B2D; font-size: 15px; font-weight: 600">Trocar foto</button>
    <a href="Cartinha.dc.html" style="flex: 1.4; height: 56px; border-radius: 14px; background: #FF5A1F; color: #0F1B2D; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700">Usar na cartinha</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
