<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Fim do set</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
a{color:#0F1B2D;text-decoration:none}
.zone{position:relative;display:block;width:100%;height:288px;background:#FFFFFF;color:#000;flex:none}
.half{position:absolute;left:164px;width:210px;height:210px;box-sizing:border-box}
.side{position:absolute;left:16px;width:140px;display:flex;flex-direction:column;align-items:flex-start}
.score{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:132px;line-height:0.92;letter-spacing:-4px;font-variant-numeric:tabular-nums}
.tag{height:30px;padding:0 12px 0 4px;border-radius:15px;display:inline-flex;align-items:center;gap:6px;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:21px}
.tag span{width:22px;height:22px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;font-size:15px}
.mesh{height:9px;background-color:#FFFFFF;background-image:repeating-linear-gradient(45deg,#000 0 1.2px,transparent 1.2px 7px),repeating-linear-gradient(-45deg,#000 0 1.2px,transparent 1.2px 7px)}
.big{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:76px;line-height:0.9;font-variant-numeric:tabular-nums}
.btn{width:100%;height:58px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:17px;font-weight:700;box-sizing:border-box}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; color: #000; font-family: Inter, sans-serif; box-sizing: border-box">

  <div aria-hidden="true" inert="" style="display: flex; flex-direction: column">
    <div style="height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 16px">
      <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 22px">1º set</span>
      <span style="display: inline-flex; gap: 4px">
        <span style="width: 12px; height: 12px; border-radius: 6px; border: 2px solid #000; box-sizing: border-box"></span>
        <span style="width: 12px; height: 12px; border-radius: 6px; border: 2px solid #000; box-sizing: border-box"></span>
      </span>
    </div>
    <div class="zone">
      <span class="side" style="top: 14px">
        <span class="tag" style="background: #FF5A1F; color: #000"><span style="background: #000; color: #FFF">A</span>Laranja</span>
        <span class="score" style="margin-top: 22px">25</span>
      </span>
      <span class="half" style="top: 78px; border: 3px solid #FF5A1F; border-bottom: 0"></span>
    </div>
    <div style="height: 104px; border-top: 3px solid #000; border-bottom: 3px solid #000; box-sizing: border-box"><div class="mesh"></div></div>
    <div class="zone">
      <span class="half" style="top: 0; border: 3px solid #1F5BFF; border-top: 0"></span>
      <span class="side" style="bottom: 14px">
        <span class="score" style="margin-bottom: 22px">22</span>
        <span class="tag" style="background: #1F5BFF; color: #FFF"><span style="background: #FFF; color: #000">B</span>Azul</span>
      </span>
    </div>
  </div>

  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(15,27,45,0.62)"></div>

  <section role="alertdialog" aria-modal="true" aria-labelledby="fim-titulo" aria-describedby="fim-desc" style="position: absolute; left: 0; right: 0; bottom: 0; background: #F6F1E7; color: #0F1B2D; border-radius: 24px 24px 0 0; padding: 10px 20px 22px; display: flex; flex-direction: column; box-sizing: border-box">
    <div aria-hidden="true" style="width: 40px; height: 4px; border-radius: 2px; background: rgba(15,27,45,0.25); align-self: center"></div>

    <h1 id="fim-titulo" style="margin: 14px 0 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 32px; line-height: 1">Fim do set 1?</h1>

    <div aria-label="Laranja 25 x 22 Azul" style="margin-top: 16px; padding: 16px; background: #FFFFFF; border: 1.5px solid rgba(15,27,45,0.12); border-radius: 18px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center">
      <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 6px">
        <span style="height: 28px; padding: 0 10px 0 3px; border-radius: 14px; background: #FF5A1F; display: inline-flex; align-items: center; gap: 6px; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 19px"><span style="width: 22px; height: 22px; border-radius: 11px; background: #0F1B2D; color: #FFF; font-size: 14px; display: inline-flex; align-items: center; justify-content: center">A</span>Laranja</span>
        <span class="big">25</span>
      </div>
      <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 26px; color: #4A5566; padding-top: 30px">x</span>
      <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 6px">
        <span style="height: 28px; padding: 0 10px 0 3px; border-radius: 14px; background: #1F5BFF; color: #FFFFFF; display: inline-flex; align-items: center; gap: 6px; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 19px"><span style="width: 22px; height: 22px; border-radius: 11px; background: #FFFFFF; color: #0F1B2D; font-size: 14px; display: inline-flex; align-items: center; justify-content: center">B</span>Azul</span>
        <span class="big" style="color: #4A5566">22</span>
      </div>
    </div>

    <p id="fim-desc" style="margin: 14px 0 0; display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 600">
      <span aria-hidden="true" style="display: inline-flex; gap: 4px">
        <span style="width: 14px; height: 14px; border-radius: 7px; background: #FF5A1F; border: 2px solid #0F1B2D; box-sizing: border-box"></span>
        <span style="width: 14px; height: 14px; border-radius: 7px; border: 2px solid #0F1B2D; box-sizing: border-box"></span>
      </span>
      Laranja vence o set e faz 1–0
    </p>

    <p style="margin: 12px 0 0; padding: 12px 14px; border-radius: 14px; background: rgba(15,27,45,0.06); display: flex; align-items: center; gap: 10px; font-size: 15px; line-height: 1.35">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M7 3v18"/><path d="M3 7l4-4 4 4"/><path d="M17 21V3"/><path d="M21 17l-4 4-4-4"/></svg>
      <span>Próximo set: troca de lados e o <b style="color: #1F5BFF">Azul</b> começa sacando</span>
    </p>

    <div style="margin-top: 18px; display: flex; flex-direction: column; gap: 10px">
      <a class="btn" href="QuadraSol.dc.html" style="border: 2px solid #0F1B2D">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>Desfazer último ponto
      </a>
      <a class="btn" href="QuadraSol.dc.html" style="background: #FF5A1F; color: #0F1B2D">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>Confirmar fim do set
      </a>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
