<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Modo quadra · Noite, set point</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
.q{--bg:#000000;--fg:#FFFFFF;--mute:#C8C8C8;--chip:#000000;--line:#FFFFFF;--undo-bg:#FFFFFF;--undo-fg:#000000}
@keyframes sp{0%,100%{background:#FFC83D}50%{background:#FFE08A}}
.sp{animation:sp 1.1s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.sp{animation:none}}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
.zone{position:relative;display:block;width:100%;height:288px;background:var(--bg);color:var(--fg);flex:none}
.half{position:absolute;left:164px;width:210px;height:210px;box-sizing:border-box}
.atk{position:absolute;left:0;right:0;height:0;border-top:2px dashed}
.m{position:absolute;transform:translate(-50%,-50%);height:28px;padding:0 9px;border-radius:14px;border:2px solid var(--line);background:var(--chip);display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;color:var(--fg);white-space:nowrap;box-sizing:border-box}
.m small{font-size:11px;font-weight:600;color:var(--mute);font-variant-numeric:tabular-nums}
.m.sv{background:#FFC83D;border-color:#FFC83D;color:#000}
.m.sv small{color:#000}
.st{position:absolute;right:-6px;top:-9px;width:18px;height:18px;border-radius:9px;background:var(--fg);color:var(--bg);font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center}
.side{position:absolute;left:16px;width:140px;display:flex;flex-direction:column;align-items:flex-start}
.score{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:132px;line-height:0.92;letter-spacing:-4px;font-variant-numeric:tabular-nums;color:var(--fg)}
.tag{height:30px;padding:0 12px 0 4px;border-radius:15px;display:inline-flex;align-items:center;gap:6px;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:21px}
.tag span{width:22px;height:22px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;font-size:15px}
.phase{font-size:13px;font-weight:700;color:var(--mute)}
.mesh{height:9px;background-color:var(--bg);background-image:repeating-linear-gradient(45deg,var(--line) 0 1.2px,transparent 1.2px 7px),repeating-linear-gradient(-45deg,var(--line) 0 1.2px,transparent 1.2px 7px)}
.pill{height:32px;padding:0 12px 0 4px;border-radius:16px;display:inline-flex;align-items:center;gap:6px;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:19px;color:#000;border:2px solid #000;box-sizing:border-box}
.pill span{width:20px;height:20px;border-radius:10px;background:#000;color:#FFF;font-size:13px;display:inline-flex;align-items:center;justify-content:center}
</style>
</helmet>
<div class="q" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; display: flex; flex-direction: column; box-sizing: border-box">

  <div style="height: 44px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 16px">
    <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 22px">2º set</span>
    <span aria-label="Sets: Laranja 1, Azul 0" style="display: inline-flex; gap: 4px">
      <span style="width: 12px; height: 12px; border-radius: 6px; background: #FF5A1F; border: 2px solid var(--line); box-sizing: border-box"></span>
      <span style="width: 12px; height: 12px; border-radius: 6px; border: 2px solid var(--line); box-sizing: border-box"></span>
    </span>
    <span style="margin-left: auto; display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 600; color: var(--mute)">
      <svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 3l18 18"/><path d="M8.5 8.5A5 5 0 0 0 6 18h11"/></svg>Salvo no celular
    </span>
    <button aria-label="Menu. Segure para abrir o menu" title="Segure para o menu" style="height: 44px; min-width: 44px; padding: 0 8px; display: inline-flex; align-items: center; justify-content: center; gap: 4px; font-size: 13px; font-weight: 700; border-radius: 12px; border: 2px solid var(--line); box-sizing: border-box">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="19" cy="12" r="2.2"/></svg>Menu
    </button>
    <button aria-label="Tela travada. Segure para sair" style="width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
    </button>
  </div>

  <button class="zone" aria-label="Ponto para Laranja. Placar 24, set point. Laranja sacando, Pedro no saque">
    <span class="side" style="top: 14px">
      <span class="tag" style="background: #FF5A1F; color: #000"><span style="background: #000; color: #FFF">A</span>Laranja</span>
      <span class="score" style="margin-top: 22px; color: #FFC83D">24</span>
      <span class="tag sp" style="margin-top: 4px; padding: 0 12px; color: #000">Set point</span>
      <span class="phase" style="margin-top: 4px; font-weight: 600">5x1 · rotação 1</span>
    </span>
    <span class="half" style="top: 78px; border: 3px solid #FF5A1F; border-bottom: 0">
      <span class="atk" aria-hidden="true" style="bottom: 70px; border-color: #FF5A1F"></span>
      <span class="m sv" style="left: 40px; top: -24px"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="#FFFFFF" stroke="#000" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3c-1.5 3-1.5 6 0 9s4.5 4.5 8.5 3.5M12 12c-3 .5-6 2.5-7.5 6" fill="none"/></svg>Pedro <small>1</small><span class="st" aria-label="levantador">L</span></span>
      <span class="m" style="left: 104px; top: 62px">João <small>6</small></span>
      <span class="m" style="left: 170px; top: 62px">Bia <small>5</small></span>
      <span class="m" style="left: 38px; top: 176px">Ana <small>2</small></span>
      <span class="m" style="left: 104px; top: 176px">Lia <small>3</small></span>
      <span class="m" style="left: 170px; top: 176px">Marcos <small>4</small></span>
    </span>
  </button>

  <div style="height: 104px; flex: none; display: flex; flex-direction: column; border-top: 3px solid var(--line); border-bottom: 3px solid var(--line); box-sizing: border-box; background: var(--bg)">
    <div class="mesh" aria-hidden="true"></div>
    <div style="display: flex; gap: 8px; padding: 6px 12px 0">
      <button style="flex: 1; height: 54px; border-radius: 14px; background: var(--undo-bg); color: var(--undo-fg); display: flex; align-items: center; justify-content: center; gap: 10px">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
        <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 24px">Desfazer</span>
      </button>
      <a href="Corrigir.dc.html" style="color: #0F1B2D; text-decoration: none; width: 112px; height: 54px; border-radius: 14px; border: 2.5px solid var(--line); display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 15px; font-weight: 700; box-sizing: border-box">
        <svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>Corrigir
      </a>
    </div>
    <div style="flex: 1; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; color: var(--mute)">Mais um ponto e o Laranja fecha o set</div>
  </div>

  <button class="zone" aria-label="Ponto para Azul. Placar 21. Azul em recepção">
    <span class="half" style="top: 0; border: 3px solid #1F5BFF; border-top: 0">
      <span class="atk" aria-hidden="true" style="top: 70px; border-color: #1F5BFF"></span>
      <span class="m" style="left: 40px; top: 32px">Duda <small>4</small></span>
      <span class="m" style="left: 104px; top: 32px">Nina <small>3</small></span>
      <span class="m" style="left: 168px; top: 32px">Caio <small>2</small></span>
      <span class="m" style="left: 104px; top: 80px">Gabi <small>6</small><span class="st" aria-label="levantadora">L</span></span>
      <span class="m" style="left: 56px; top: 160px">Léo <small>5</small></span>
      <span class="m" style="left: 156px; top: 160px">Rafa <small>1</small></span>
    </span>
    <span class="side" style="bottom: 14px">
      <span class="phase" style="font-weight: 600">5x1 · rotação 6</span>
      <span class="phase" style="margin-bottom: 6px">Em recepção</span>
      <span class="score" style="margin-bottom: 22px">21</span>
      <span class="tag" style="background: #1F5BFF; color: #FFF"><span style="background: #FFF; color: #000">B</span>Azul</span>
    </span>
  </button>

  <div style="flex: 1; background: #0F1B2D; color: #FFF; border-top: 3px solid #FFF; padding: 10px 16px 12px; display: flex; flex-direction: column; justify-content: space-between; box-sizing: border-box">
    <div aria-label="Na fila: Davi, Sofia (reservas)" style="display: flex; align-items: center; gap: 8px">
      <span style="font-size: 14px; font-weight: 700">Na fila</span>
      <span class="pill" style="background: #FFFFFF"><span>1</span>Davi</span>
      <span class="pill" style="background: #FFFFFF"><span>2</span>Sofia</span>
      <span style="font-size: 13px; font-weight: 600; color: #C8C8C8">reservas</span>
    </div>
    <div style="display: flex; align-items: center; gap: 10px">
      <span style="display: inline-flex; align-items: center; gap: 5px; font-size: 14px; font-weight: 600">
        <svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="#FF5A1F" stroke="#FFF" stroke-width="1.6" stroke-linejoin="round"><path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-3 2-4 2-6 1.5 1 2 2 2 3 1-2 1-4 1-7z"/></svg>Laranja venceu 2 seguidas
      </span>
      <span style="margin-left: auto; font-size: 13px; font-weight: 600; color: #C8C8C8; white-space: nowrap">perde sai · saída parcial</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
