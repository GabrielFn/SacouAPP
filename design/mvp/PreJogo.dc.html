<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Pré-jogo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
a{color:#0F1B2D;text-decoration:none}a:hover{color:#1F5BFF}
.lbl{margin:0 0 6px;font-size:14px;font-weight:700}
.seg{display:grid;padding:4px;border-radius:14px;background:rgba(15,27,45,0.08);gap:0}
.seg button{height:44px;border-radius:11px;font-size:15px;font-weight:500;color:#4A5566}
.seg button[aria-pressed="true"]{background:#FFFFFF;color:#0F1B2D;font-weight:700;box-shadow:0 1px 0 rgba(15,27,45,0.2)}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0F1B2D; font-family: Inter, sans-serif; color: #0F1B2D; box-sizing: border-box">
  <svg aria-hidden="true" width="390" height="120" viewBox="0 0 390 120" style="position: absolute; left: 0; top: 0" fill="none" stroke="rgba(246,241,231,0.14)" stroke-width="2"><rect x="30" y="10" width="330" height="200"/><line x1="30" y1="60" x2="360" y2="60"/></svg>

  <section aria-label="Configurar partida" style="position: absolute; left: 0; right: 0; bottom: 0; top: 44px; background: #F6F1E7; border-radius: 24px 24px 0 0; padding: 10px 20px 24px; display: flex; flex-direction: column; gap: 14px; box-sizing: border-box">
    <div aria-hidden="true" style="width: 40px; height: 4px; border-radius: 2px; background: rgba(15,27,45,0.25); align-self: center"></div>
    <div style="display: flex; align-items: center">
      <h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 30px">Partida 3</h1>
      <a href="Sorteio.dc.html" aria-label="Fechar" style="margin-left: auto; width: 48px; height: 48px; margin-right: -12px; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
    </div>

    <div style="display: flex; align-items: stretch; gap: 8px">
      <button style="flex: 1; height: 64px; border-radius: 14px; background: #FFFFFF; border: 1.5px solid rgba(15,27,45,0.12); display: flex; align-items: center; overflow: hidden; text-align: left">
        <span aria-hidden="true" style="width: 8px; align-self: stretch; background: #FF5A1F"></span>
        <span style="margin-left: 10px; width: 26px; height: 26px; border-radius: 7px; background: #FF5A1F; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 18px; display: flex; align-items: center; justify-content: center">A</span>
        <span style="margin-left: 8px; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 22px">Laranja</span>
      </button>
      <span style="align-self: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 20px; color: #4A5566">x</span>
      <button style="flex: 1; height: 64px; border-radius: 14px; background: #FFFFFF; border: 1.5px solid rgba(15,27,45,0.12); display: flex; align-items: center; overflow: hidden; text-align: left">
        <span aria-hidden="true" style="width: 8px; align-self: stretch; background: #1F5BFF"></span>
        <span style="margin-left: 10px; width: 26px; height: 26px; border-radius: 7px; background: #1F5BFF; color: #FFFFFF; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 18px; display: flex; align-items: center; justify-content: center">B</span>
        <span style="margin-left: 8px; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 22px">Azul</span>
      </button>
    </div>

    <div style="display: flex; align-items: center; gap: 12px">
      <span style="font-size: 15px; font-weight: 700">Pontos por set</span>
      <div style="margin-left: auto; display: flex; align-items: center; gap: 4px; background: #FFFFFF; border-radius: 14px; border: 1.5px solid rgba(15,27,45,0.12); padding: 2px">
        <button aria-label="Menos pontos" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
        <span style="width: 44px; text-align: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 30px; font-variant-numeric: tabular-nums">25</span>
        <button aria-label="Mais pontos" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      </div>
    </div>

    <div>
      <p class="lbl">Sets</p>
      <div class="seg" style="grid-template-columns: repeat(3, minmax(0, 1fr))">
        <button aria-pressed="false">1 set</button>
        <button aria-pressed="true">Melhor de 3</button>
        <button aria-pressed="false">Melhor de 5</button>
      </div>
      <p style="margin: 6px 0 0; font-size: 14px; color: #4A5566">Tie-break: <b style="color: #0F1B2D">15 pontos</b></p>
    </div>

    <div>
      <p class="lbl">Saca primeiro</p>
      <div style="display: flex; gap: 8px">
        <div class="seg" style="flex: 1; grid-template-columns: repeat(2, minmax(0, 1fr))">
          <button aria-pressed="true">A · João</button>
          <button aria-pressed="false">B · Gabi</button>
        </div>
        <button style="height: 52px; padding: 0 14px; border-radius: 14px; border: 1.5px solid #0F1B2D; font-size: 15px; font-weight: 600">Sortear</button>
      </div>
    </div>

    <div>
      <p class="lbl">Rotação de cada time</p>
      <div class="seg" style="grid-template-columns: repeat(2, minmax(0, 1fr)); margin-bottom: 8px">
        <button aria-pressed="true" style="display: flex; align-items: center; justify-content: center; gap: 6px"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 5px; background: #FF5A1F"></span>Laranja · 5x1</button>
        <button aria-pressed="false" style="display: flex; align-items: center; justify-content: center; gap: 6px"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 5px; background: #1F5BFF"></span>Azul · 5x1</button>
      </div>
      <div role="radiogroup" aria-label="Sistema de rotação do Laranja" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px">
        <button role="radio" aria-checked="false" style="height: 56px; border-radius: 12px; background: #FFFFFF; border: 1.5px solid rgba(15,27,45,0.15); font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 20px">Livre</button>
        <button role="radio" aria-checked="false" style="height: 56px; border-radius: 12px; background: #FFFFFF; border: 1.5px solid rgba(15,27,45,0.15); font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 20px">6x0</button>
        <button role="radio" aria-checked="false" style="height: 56px; border-radius: 12px; background: #FFFFFF; border: 1.5px solid rgba(15,27,45,0.15); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px"><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 20px; line-height: 1">4x2</span><span style="font-size: 11px; font-weight: 800; padding: 1px 6px; border-radius: 6px; background: #FFC83D">Pro</span></button>
        <button role="radio" aria-checked="true" style="height: 56px; border-radius: 12px; background: #0F1B2D; color: #F6F1E7; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px"><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 20px; line-height: 1">5x1</span><span style="font-size: 11px; font-weight: 800; padding: 1px 6px; border-radius: 6px; background: #FFC83D; color: #0F1B2D">Pro</span></button>
        <button role="radio" aria-checked="false" style="height: 56px; border-radius: 12px; background: #FFFFFF; border: 1.5px solid rgba(15,27,45,0.15); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px"><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 20px; line-height: 1">6x2</span><span style="font-size: 11px; font-weight: 800; padding: 1px 6px; border-radius: 6px; background: #FFC83D">Pro</span></button>
      </div>
      <div style="margin-top: 8px; display: flex; align-items: center; gap: 8px; font-size: 14px">
        <span>Levantador do Laranja: <b>Pedro</b>, começa na posição 2</span>
        <a href="Escalacao.dc.html" style="margin-left: auto; height: 44px; padding: 0 4px; font-size: 14px; font-weight: 700; color: #1F5BFF">Escalação</a>
      </div>
    </div>

    <p style="margin: 0; font-size: 14px; color: #4A5566">Laranja tem 6, sem banco.</p>

    <a href="QuadraSol.dc.html" style="margin-top: auto; height: 58px; border-radius: 14px; background: #FF5A1F; color: #0F1B2D; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700">Começar partida</a>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
