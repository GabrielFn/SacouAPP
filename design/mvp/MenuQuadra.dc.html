<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Menu da partida</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
.q{--bg:#FFFFFF;--fg:#000000;--mute:#3A3A3A;--chip:#FFFFFF;--line:#000000}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
a{color:#0F1B2D;text-decoration:none}
.zone{position:relative;display:block;width:100%;height:288px;background:var(--bg);color:var(--fg);flex:none}
.half{position:absolute;left:164px;width:210px;height:210px;box-sizing:border-box}
.atk{position:absolute;left:0;right:0;height:0;border-top:2px dashed}
.m{position:absolute;transform:translate(-50%,-50%);height:28px;padding:0 9px;border-radius:14px;border:2px solid var(--line);background:var(--chip);display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;color:var(--fg);white-space:nowrap;box-sizing:border-box}
.m small{font-size:11px;font-weight:600;color:var(--mute)}
.m.sv{background:#FFC83D}
.side{position:absolute;left:16px;width:140px;display:flex;flex-direction:column;align-items:flex-start}
.score{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:132px;line-height:0.92;letter-spacing:-4px;font-variant-numeric:tabular-nums;color:var(--fg)}
.tag{height:30px;padding:0 12px 0 4px;border-radius:15px;display:inline-flex;align-items:center;gap:6px;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:21px}
.tag span{width:22px;height:22px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;font-size:15px}
.phase{font-size:13px;font-weight:700;color:var(--mute)}
.it{width:100%;height:52px;display:flex;align-items:center;gap:14px;padding:0 4px;font-size:16px;font-weight:600;color:#0F1B2D;text-align:left;box-sizing:border-box}
.it svg{flex:none}
.it .chev{margin-left:auto;color:#4A5566}
.grp{background:#FFFFFF;border:1.5px solid rgba(15,27,45,0.12);border-radius:16px;padding:0 12px}
.grp > *+*{border-top:1px solid rgba(15,27,45,0.08)}
.seg{display:grid;padding:3px;border-radius:12px;background:rgba(15,27,45,0.08)}
.seg button{height:38px;padding:0 12px;border-radius:9px;font-size:14px;font-weight:500;color:#4A5566;display:flex;align-items:center;gap:5px}
.seg button[aria-pressed="true"]{background:#FFFFFF;color:#0F1B2D;font-weight:700;box-shadow:0 1px 0 rgba(15,27,45,0.2)}
</style>
</helmet>
<div class="q" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; box-sizing: border-box">

  <div aria-hidden="true" inert="" style="display: flex; flex-direction: column">
    <div style="height: 44px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 16px">
      <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 22px">2º set</span>
      <span style="display: inline-flex; gap: 4px">
        <span style="width: 12px; height: 12px; border-radius: 6px; background: #FF5A1F; border: 2px solid #000; box-sizing: border-box"></span>
        <span style="width: 12px; height: 12px; border-radius: 6px; border: 2px solid #000; box-sizing: border-box"></span>
      </span>
      <span style="margin-left: auto; height: 44px; padding: 0 8px; display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 700; border-radius: 12px; border: 2px solid #000; box-sizing: border-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="19" cy="12" r="2.2"/></svg>Menu
      </span>
      <span style="width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
      </span>
    </div>
    <div class="zone">
      <span class="side" style="top: 14px">
        <span class="tag" style="background: #FF5A1F; color: #000"><span style="background: #000; color: #FFF">A</span>Laranja</span>
        <span class="score" style="margin-top: 22px">18</span>
        <span class="phase" style="margin-top: 6px">Sacando</span>
        <span class="phase" style="font-weight: 600">5x1 · rotação 2</span>
      </span>
      <span class="half" style="top: 78px; border: 3px solid #FF5A1F; border-bottom: 0">
        <span class="atk" style="bottom: 70px; border-color: #FF5A1F"></span>
        <span class="m sv" style="left: 40px; top: -24px">João <small>1</small></span>
        <span class="m" style="left: 96px; top: 62px">Bia <small>6</small></span>
        <span class="m" style="left: 170px; top: 62px">Marcos <small>5</small></span>
        <span class="m" style="left: 38px; top: 176px">Pedro <small>2</small></span>
        <span class="m" style="left: 104px; top: 176px">Ana <small>3</small></span>
        <span class="m" style="left: 170px; top: 176px">Lia <small>4</small></span>
      </span>
    </div>
  </div>

  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(15,27,45,0.62)"></div>

  <section role="dialog" aria-modal="true" aria-labelledby="menu-titulo" style="position: absolute; left: 0; right: 0; bottom: 0; top: 280px; background: #F6F1E7; color: #0F1B2D; border-radius: 24px 24px 0 0; padding: 10px 16px 20px; display: flex; flex-direction: column; gap: 10px; box-sizing: border-box">
    <div aria-hidden="true" style="width: 40px; height: 4px; border-radius: 2px; background: rgba(15,27,45,0.25); align-self: center"></div>
    <div style="display: flex; align-items: center; padding-left: 4px">
      <div>
        <h1 id="menu-titulo" style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 28px; line-height: 1">Menu da partida</h1>
        <p style="margin: 3px 0 0; font-size: 13px; color: #4A5566">Partida 3 · 2º set · Laranja 18–15 Azul</p>
      </div>
      <a href="QuadraSol.dc.html" aria-label="Fechar menu" style="margin-left: auto; width: 48px; height: 48px; margin-right: -8px; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
    </div>

    <nav aria-label="Ajustes do jogo" class="grp">
      <a class="it" href="Escalacao.dc.html">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="1"/><path d="M4 15h16"/><circle cx="9" cy="8" r="1.4"/><circle cx="15" cy="8" r="1.4"/><circle cx="12" cy="11.5" r="1.4"/></svg>
        Escalação
        <svg class="chev" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
      </a>
      <a href="TrocarJogador.dc.html" class="it" style="color: #0F1B2D; text-decoration: none; ">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4L3 8l4 4"/><path d="M3 8h13"/><path d="M17 20l4-4-4-4"/><path d="M21 16H8"/></svg>
        Trocar jogador
        <svg class="chev" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
      </a>
      <a class="it" href="Corrigir.dc.html">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        <span>Corrigir <span style="font-weight: 500; color: #4A5566">· linha do tempo</span></span>
        <svg class="chev" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
      </a>
      <button class="it">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v18"/><path d="M3 7l4-4 4 4"/><path d="M17 21V3"/><path d="M21 17l-4 4-4-4"/></svg>
        Inverter lados
      </button>
      <div class="it" style="cursor: default">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.4 1.4M17.6 17.6L19 19M5 19l1.4-1.4M17.6 6.4L19 5"/></svg>
        Tema
        <div class="seg" role="group" aria-label="Tema da quadra" style="margin-left: auto; grid-template-columns: repeat(2, auto)">
          <button aria-pressed="true">Sol</button>
          <button aria-pressed="false">Noite</button>
        </div>
      </div>
    </nav>


    <div class="grp">
      <a class="it" href="FimPartida.dc.html">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4"/><path d="M5 4h12l-2 4 2 4H5"/></svg>
        Encerrar partida
        <svg class="chev" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
      </a>
      <a class="it" href="Resumo.dc.html" style="color: #C4251B">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><rect x="9" y="9" width="6" height="6" rx="0.5"/></svg>
        <span>Encerrar rodada <span style="font-weight: 500">· fecha a noite toda</span></span>
      </a>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
