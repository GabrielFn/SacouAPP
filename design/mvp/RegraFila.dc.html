<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Regra da fila</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left}
a{color:#0F1B2D;text-decoration:none}a:hover{color:#1F5BFF}
.blk{margin:0 16px 8px;background:#FFFFFF;border:1.5px solid rgba(15,27,45,0.12);border-radius:16px}
.bh{display:flex;align-items:center;gap:6px;min-height:56px;padding:0 6px 0 14px}
.bh h2{margin:0;font-size:16px;font-weight:700}
.acc{flex:1;min-width:0;min-height:56px;display:flex;align-items:center;gap:8px;padding:8px 0}
.acc .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.sum{font-size:13px;color:#4A5566;line-height:1.35}
.chev{margin-left:auto;flex:none;color:#4A5566}
.row{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 6px 0 14px;border-top:1px solid rgba(15,27,45,0.08);font-size:15px;font-weight:600}
.val{margin-left:auto;display:inline-flex;align-items:center;gap:4px;height:44px;padding:0 8px;color:#4A5566;font-weight:600;font-size:15px}
.help{margin:-6px 14px 0;padding-bottom:8px;font-size:13px;color:#4A5566;line-height:1.35}
.sw{width:58px;height:44px;flex:none;display:flex;align-items:center;justify-content:center}
.tr{width:50px;height:30px;border-radius:15px;background:rgba(15,27,45,0.22);position:relative}
.tr span{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:12px;background:#FFFFFF;box-shadow:0 1px 2px rgba(15,27,45,0.3)}
.sw[aria-checked="true"] .tr{background:#FF5A1F}
.sw[aria-checked="true"] .tr span{left:23px}
.pro{height:22px;padding:0 7px;border-radius:6px;background:#FFC83D;color:#0F1B2D;font-size:13px;font-weight:800;display:inline-flex;align-items:center}
.lbl{margin:0;padding:10px 14px 6px;font-size:14px;font-weight:700;border-top:1px solid rgba(15,27,45,0.08)}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 12px}
.chip{height:44px;padding:0 14px;border-radius:22px;border:1.5px solid rgba(15,27,45,0.18);background:#FFFFFF;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;box-sizing:border-box}
.chip[aria-checked="true"]{background:#0F1B2D;color:#F6F1E7;border-color:#0F1B2D;font-weight:700}
.sys{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;padding:0 14px 12px}
.sys button{height:56px;border-radius:12px;background:#FFFFFF;border:1.5px solid rgba(15,27,45,0.15);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:20px;line-height:1}
.sys button[aria-checked="true"]{background:#0F1B2D;color:#F6F1E7;border-color:#0F1B2D}
.sys small{font-family:Inter,sans-serif;font-size:13px;font-weight:800;padding:1px 6px;border-radius:6px;background:#FFC83D;color:#0F1B2D;line-height:1.3}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));padding:4px;border-radius:14px;background:rgba(15,27,45,0.08);margin:0 14px 12px}
.seg button{height:44px;border-radius:11px;font-size:15px;font-weight:500;color:#4A5566;text-align:center}
.seg button[aria-pressed="true"]{background:#FFFFFF;color:#0F1B2D;font-weight:700;box-shadow:0 1px 0 rgba(15,27,45,0.2)}
.opt{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;min-height:56px;width:100%;box-sizing:border-box}
.opt+.opt{border-top:1px solid rgba(15,27,45,0.08)}
.rd{width:24px;height:24px;border-radius:12px;border:2px solid rgba(15,27,45,0.4);flex:none;margin-top:1px;box-sizing:border-box}
.opt[aria-checked="true"] .rd{border:7px solid #FF5A1F}
.ot{display:flex;flex-direction:column;gap:3px}
.ot b{font-size:16px}
.ot span{font-size:13px;color:#4A5566;line-height:1.35}
.stp{display:flex;align-items:center;gap:10px;margin-top:8px}
.mini{width:44px;height:44px;border-radius:22px;border:1.5px solid #0F1B2D;display:flex;align-items:center;justify-content:center}
.num{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:26px;min-width:28px;text-align:center}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F6F1E7; font-family: Inter, sans-serif; color: #0F1B2D; box-sizing: border-box">

  <header style="padding: 20px 12px 0; display: flex; align-items: center; gap: 4px">
    <a href="AjustesGrupo.dc.html" aria-label="Voltar" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a>
    <h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 32px; line-height: 1">Regra da fila</h1>
  </header>
  <p style="margin: 2px 20px 12px; font-size: 14px; color: #4A5566">Racha de terça · quem sai quando um time perde</p>

  <section class="blk" aria-labelledby="perdedor">
    <h2 id="perdedor" style="margin: 0; padding: 12px 14px 4px; font-size: 16px; font-weight: 700">Do time que perdeu</h2>
    <div role="radiogroup" aria-labelledby="perdedor">
      <button class="opt" role="radio" aria-checked="true"><span class="rd" aria-hidden="true"></span><span class="ot"><b>Automático</b><span>Sai o time inteiro se há um time esperando. Se só há avulsos, saem tantos quanto esperam.</span></span></button>
      <button class="opt" role="radio" aria-checked="false"><span class="rd" aria-hidden="true"></span><span class="ot"><b>Sempre o time inteiro</b><span>O perdedor sai inteiro, mesmo com pouca gente esperando.</span></span></button>
      <div class="opt" style="cursor: default">
        <button role="radio" aria-checked="false" aria-label="Número fixo de jogadores" class="rd" style="background: none"></button>
        <span class="ot"><b>Número fixo</b><span>Sai sempre o mesmo número do perdedor.</span><span class="stp"><button class="mini" aria-label="Menos jogadores"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/></svg></button><span class="num">2</span><button class="mini" aria-label="Mais jogadores"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button><span style="font-size: 14px; font-weight: 600">saem por partida</span></span></span>
      </div>
    </div>
  </section>

  <section class="blk" aria-label="Vencedor">
    <div class="bh">
      <span class="ot" style="flex: 1; padding: 8px 0"><b>Vencedor também sai</b><span>Depois de algumas vitórias seguidas, para ninguém dominar a noite.</span></span>
      <button class="sw" role="switch" aria-checked="true" aria-label="Vencedor também sai"><span class="tr"><span></span></span></button>
    </div>
    <div style="padding: 0 14px 12px"><span class="stp"><button class="mini" aria-label="Menos vitórias"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/></svg></button><span class="num">3</span><button class="mini" aria-label="Mais vitórias"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button><span style="font-size: 14px; font-weight: 600">vitórias seguidas</span></span></div>
  </section>


  <div style="position: absolute; left: 16px; right: 16px; bottom: 28px">
    <a href="AjustesGrupo.dc.html" style="height: 56px; border-radius: 14px; background: #FF5A1F; color: #0F1B2D; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700">Salvar regra</a>
  </div>
</div>
</x-dc>

</body>
</html>
