.rd{width:24px;height:24px;border-radius:12px;border:2px solid rgba(15,27,45,0.4);flex:none;box-sizing:border-box}

.pick{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:0 14px;box-sizing:border-box;font-size:15px;font-weight:600}
.pick+.pick{border-top:1px solid rgba(15,27,45,0.08)}
