<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Trocar jogador</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left}
input{font:inherit;color:inherit}
a{color:#0F1B2D;text-decoration:none}a:hover{color:#1F5BFF}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#F6F1E7;border-radius:24px 24px 0 0;padding:12px 20px 28px;display:flex;flex-direction:column;gap:14px;box-sizing:border-box}
.grab{align-self:center;width:40px;height:5px;border-radius:3px;background:rgba(15,27,45,0.2)}
.h2{margin:0;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:28px;line-height:1}
.h1{margin:0;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:36px;line-height:1}
.mut{font-size:14px;color:#4A5566;line-height:1.4;margin:0}
.lbl{font-size:14px;font-weight:700;margin:0 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:44px;padding:0 14px;border-radius:22px;border:1.5px solid rgba(15,27,45,0.18);background:#FFFFFF;font-size:14px;font-weight:600;display:inline-flex;align-items:center;box-sizing:border-box}
.chip[aria-checked="true"],.chip[aria-pressed="true"]{background:#0F1B2D;color:#F6F1E7;border-color:#0F1B2D;font-weight:700}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));padding:4px;border-radius:14px;background:rgba(15,27,45,0.08)}
.seg button{height:44px;border-radius:11px;font-size:15px;font-weight:500;color:#4A5566;text-align:center}
.seg button[aria-pressed="true"]{background:#FFFFFF;color:#0F1B2D;font-weight:700;box-shadow:0 1px 0 rgba(15,27,45,0.2)}
.card{background:#FFFFFF;border-radius:16px;border:1.5px solid rgba(15,27,45,0.1)}
.row{display:flex;align-items:center;gap:10px;min-height:52px;padding:0 14px;font-size:15px;font-weight:600}
.row+.row{border-top:1px solid rgba(15,27,45,0.08)}
.cta{height:56px;border-radius:14px;background:#FF5A1F;color:#0F1B2D;display:flex;align-items:center;justify-content:center;gap:8px;font-size:16px;font-weight:700;text-align:center;width:100%}
.sec{height:56px;border-radius:14px;border:1.5px solid #0F1B2D;display:flex;align-items:center;justify-content:center;gap:8px;font-size:16px;font-weight:700;text-align:center;width:100%;box-sizing:border-box}
.danger{height:56px;border-radius:14px;background:#B42318;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;text-align:center;width:100%}
.av{width:44px;height:44px;border-radius:22px;flex:none;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:18px;background:#E9E1D1;color:#0F1B2D}
.in{height:52px;border-radius:12px;border:1.5px solid rgba(15,27,45,0.25);background:#FFFFFF;padding:0 14px;font-size:16px;font-weight:600;box-sizing:border-box;width:100%}
.rd{width:24px;height:24px;border-radius:12px;border:2px solid rgba(15,27,45,0.4);flex:none;box-sizing:border-box}
[aria-checked="true"] > .rd{border:7px solid #FF5A1F}
.pick{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:0 14px;box-sizing:border-box;font-size:15px;font-weight:600}
.pick+.pick{border-top:1px solid rgba(15,27,45,0.08)}
.pick[aria-checked="true"]{background:#FFF1EA}
.tag{font-size:12px;font-weight:700;color:#4A5566;margin-left:auto}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F6F1E7; font-family: Inter, sans-serif; color: #0F1B2D; box-sizing: border-box">
  <header style="padding: 20px 12px 0; display: flex; align-items: center">
    <a href="MenuQuadra.dc.html" aria-label="Voltar" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a>
    <h1 class="h2" style="font-size: 30px">Trocar jogador</h1>
  </header>
  <div style="padding: 6px 16px 0; display: flex; flex-direction: column; gap: 12px">
    <div class="seg" role="group" aria-label="Time"><button aria-pressed="true">Laranja</button><button aria-pressed="false">Azul</button></div>
    <div><p class="lbl" id="sai" style="padding-left: 4px">Sai</p><div class="card" role="radiogroup" aria-labelledby="sai"><button class="pick" role="radio" aria-checked="false"><span class="av" aria-hidden="true" style="width: 36px; height: 36px; font-size: 15px">JO</span>João<span class="tag">pos 1 · sacando</span><span class="rd" aria-hidden="true"></span></button><button class="pick" role="radio" aria-checked="false"><span class="av" aria-hidden="true" style="width: 36px; height: 36px; font-size: 15px">BI</span>Bia<span class="tag">pos 6</span><span class="rd" aria-hidden="true"></span></button><button class="pick" role="radio" aria-checked="true"><span class="av" aria-hidden="true" style="width: 36px; height: 36px; font-size: 15px">MA</span>Marcos<span class="tag">pos 5</span><span class="rd" aria-hidden="true"></span></button><button class="pick" role="radio" aria-checked="false"><span class="av" aria-hidden="true" style="width: 36px; height: 36px; font-size: 15px">PE</span>Pedro<span class="tag">pos 2 · levantador</span><span class="rd" aria-hidden="true"></span></button><button class="pick" role="radio" aria-checked="false"><span class="av" aria-hidden="true" style="width: 36px; height: 36px; font-size: 15px">AN</span>Ana<span class="tag">pos 3</span><span class="rd" aria-hidden="true"></span></button><button class="pick" role="radio" aria-checked="false"><span class="av" aria-hidden="true" style="width: 36px; height: 36px; font-size: 15px">LI</span>Lia<span class="tag">pos 4</span><span class="rd" aria-hidden="true"></span></button></div></div>
    <div><p class="lbl" id="ent" style="padding-left: 4px">Entra</p><div class="card" role="radiogroup" aria-labelledby="ent"><button class="pick" role="radio" aria-checked="true"><span class="av" aria-hidden="true" style="width: 36px; height: 36px; font-size: 15px">DU</span>Duda<span class="tag">banco</span><span class="rd" aria-hidden="true"></span></button><button class="pick" role="radio" aria-checked="false"><span class="av" aria-hidden="true" style="width: 36px; height: 36px; font-size: 15px">CL</span>Clara<span class="tag">fila · 1ª</span><span class="rd" aria-hidden="true"></span></button><button class="pick" role="radio" aria-checked="false"><span class="av" aria-hidden="true" style="width: 36px; height: 36px; font-size: 15px">IG</span>Igor<span class="tag">fila · 2º</span><span class="rd" aria-hidden="true"></span></button></div></div>
    <p class="mut" style="font-size: 13px">A Duda entra na posição 5, no lugar do Marcos. O Marcos vai para o banco.</p>
  </div>
  <div style="position: absolute; left: 16px; right: 16px; bottom: 26px"><a href="QuadraSol.dc.html" class="cta">Trocar Marcos por Duda</a></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {

}
</script>
</body>
</html>
